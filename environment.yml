name: rgw_shiny
channels:
  - conda-forge
dependencies:
  - c-compiler
  - cxx-compiler
  - r-base
  - r-shiny
  - r-bslib
  - r-sf
  - r-dplyr
  - r-readr
  - r-ggplot2
  - r-arrow
  - r-viridislite
  - r-plotly
  - r-stars
  - r-interp
  - r-isoband
  - r-shinymanager
  - r-scrypt
  - r-dt
  - r-lubridate
  - r-sfarrow
  - r-remotes
  # Async background processing (future_promise) so heavy ZIP/HDS extraction
  # doesn't block the Shiny event loop / disconnect the browser.
  - r-future
  - r-promises
  # Python + flopy power model processing (ZIP extraction, .hds -> parquet) so
  # ZIP upload and scenario/baseline .hds loading work inside the container.
  # Note: this enables *reading* model output. Running models (null runs,
  # automation) additionally needs MODFLOW executables (e.g. via `get-modflow`).
  - python
  - flopy
  - pandas
  - numpy
  - pyarrow
